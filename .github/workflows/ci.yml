name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege for the default token; jobs that need more declare it.
permissions:
  contents: read

# Cancel in-flight runs for the same branch when a new push arrives
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Web — type check + tests + lint + docs check
  # ─────────────────────────────────────────────
  web:
    name: Web (type-check · tests · lint · docs)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Vitest needs these to be present even if not connecting to real services.
      # Real secrets live in GitHub Actions secrets — these are CI-safe dummies.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      AUTH_SECRET: ci-secret-not-used-in-unit-tests
      AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      # Disable telemetry
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Documentation drift check
        run: npm run docs:check

      - name: Script tests
        run: npm run test:scripts

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test -- --run --reporter=verbose

      - name: Lint
        run: npm run lint

  # ─────────────────────────────────────────────
  # Job 2: Shared package — type check
  # ─────────────────────────────────────────────
  shared:
    name: Shared package (type-check)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    defaults:
      run:
        working-directory: packages/shared

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: packages/shared/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

  # PostgreSQL-specific availability/concurrency tests run only against this
  # disposable service and its dedicated *_test database.
  postgres-integration:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hostello
          POSTGRES_PASSWORD: hostello
          POSTGRES_DB: hostello_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hostello -d hostello_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://hostello:hostello@localhost:5432/hostello_test
      HOSTELLO_TEST_DATABASE_URL: postgresql://hostello:hostello@localhost:5432/hostello_test
      RUN_AVAILABILITY_ALERTS_POSTGRES_TESTS: "1"
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations to disposable test database
        run: npx prisma migrate deploy

      - name: Run guarded PostgreSQL integration test
        run: npm test -- --run src/lib/availability-alerts.postgres.integration.test.ts

  # ─────────────────────────────────────────────
  # Job 3: Vercel preview deploy
  # Only runs on PRs (not on pushes to main — that's handled by production.yml).
  # Waits for all checks to pass, then deploys a preview and posts the URL.
  # ─────────────────────────────────────────────
  preview:
    name: Preview deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Only deploy previews for pull requests, not direct pushes to main
    if: github.event_name == 'pull_request'
    # Only deploy after all quality gates pass
    needs: [web, shared, postgres-integration]

    permissions:
      contents: read        # job-level permissions replace the defaults, so checkout needs this
      pull-requests: write  # needed to post the URL comment

    env:
      VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Vercel CLI
        run: npm install --global vercel@62.7.0

      - name: Pull Vercel environment (preview)
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build project
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Deploy to Vercel (preview)
        id: deploy
        run: |
          DEPLOY_URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$DEPLOY_URL" >> $GITHUB_OUTPUT

      - name: Post preview URL as PR comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const previewUrl = '${{ steps.deploy.outputs.url }}';
            const sha        = context.sha.slice(0, 7);
            const actor      = context.actor;
            const body = [
              '## \u1F680 Preview deployment ready',
              '',
              '| | |',
              '|---|---|',
              `| **URL** | ${previewUrl} |`,
              `| **Commit** | \`${sha}\` |`,
              `| **Deployed by** | @${actor} |`,
              '',
              '### Quick smoke test',
              `- [ ] [Hostel search API](${previewUrl}/api/hostels) returns JSON`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(
              c => c.user.login === 'github-actions[bot]' &&
                   c.body.includes('Preview deployment ready')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner:      context.repo.owner,
                repo:       context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner:        context.repo.owner,
                repo:         context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }