name: Deploy to production

on:
  push:
    branches: [main]

# Least privilege for the default token.
permissions:
  contents: read

# Only one production deploy at a time
concurrency:
  group: production-deploy
  cancel-in-progress: false   # never cancel an in-flight production deploy

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Gate: run all checks before touching production
  # (Same jobs as ci.yml — duplicated intentionally so production deploys
  #  never skip the quality gate even if ci.yml is modified incorrectly)
  # ─────────────────────────────────────────────────────────────────────────
  gate-web:
    name: Gate — Web checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DATABASE_URL:        postgresql://ci:ci@localhost:5432/ci
      AUTH_SECRET:         ci-secret-not-used-in-unit-tests
      AUTH_URL:            http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run docs:check
      - run: npm run test:scripts
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npm test -- --run
      - run: npm run lint

  gate-postgres:
    name: Gate — PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hostello
          POSTGRES_PASSWORD: hostello
          POSTGRES_DB: hostello_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hostello -d hostello_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://hostello:hostello@localhost:5432/hostello_test
      HOSTELLO_TEST_DATABASE_URL: postgresql://hostello:hostello@localhost:5432/hostello_test
      RUN_AVAILABILITY_ALERTS_POSTGRES_TESTS: "1"
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm test -- --run src/lib/availability-alerts.postgres.integration.test.ts

  # ─────────────────────────────────────────────────────────────────────────
  # Deploy: only runs after the gate jobs pass
  # ─────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [gate-web, gate-postgres]

    # Approval gate: configure required reviewers on the "production"
    # environment in GitHub (Settings > Environments). Until that is set the
    # job runs without approval. The environment also records each deployment.
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}

    env:
      VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@62.7.0

      - name: Pull Vercel environment (production)
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      # Build before touching the database: a failed build must not leave the
      # production schema ahead of the code that is still serving traffic. The
      # build does not run migrations or query the database.
      - name: Build project
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Snapshot production database (Neon branch)
        run: node scripts/neon-snapshot.mjs
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          NEON_PRODUCTION_BRANCH_ID: ${{ vars.NEON_PRODUCTION_BRANCH_ID }}
          NEON_SNAPSHOT_REQUIRED: ${{ vars.NEON_SNAPSHOT_REQUIRED }}

      # Migrations must be backward compatible with the currently deployed
      # code (expand, then contract in a later release), because the old
      # version keeps serving traffic until the deploy step below finishes.
      - name: Apply production database migrations
        run: npm run db:migrate:deploy
        env:
          DATABASE_URL: ${{ secrets.HOSTELLO_PRODUCTION_DATABASE_URL }}

      - name: Deploy to production
        id: deploy
        run: |
          DEPLOY_URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$DEPLOY_URL" >> $GITHUB_OUTPUT

      - name: Print deploy URL
        run: echo "Deployed to ${{ steps.deploy.outputs.url }}"
