name: Deploy to production

on:
  push:
    branches: [main]

# Least privilege for the default token.
permissions:
  contents: read

# Only one production deploy at a time
concurrency:
  group: production-deploy
  cancel-in-progress: false   # never cancel an in-flight production deploy

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Gate: run all checks before touching production
  # (Same jobs as ci.yml — duplicated intentionally so production deploys
  #  never skip the quality gate even if ci.yml is modified incorrectly)
  # ─────────────────────────────────────────────────────────────────────────
  gate-web:
    name: Gate — Web checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DATABASE_URL:        postgresql://ci:ci@localhost:5432/ci
      AUTH_SECRET:         ci-secret-not-used-in-unit-tests
      AUTH_URL:            http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run docs:check
      - run: npm run test:scripts
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npm test -- --run
      - run: npm run lint

  # ─────────────────────────────────────────────────────────────────────────
  # Deploy: only runs after the gate jobs pass
  # ─────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [gate-web]

    # Approval gate: configure required reviewers on the "production"
    # environment in GitHub (Settings > Environments). Until that is set the
    # job runs without approval. The environment also records each deployment.
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}

    env:
      VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@62.7.0

      - name: Pull Vercel environment (production)
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Snapshot production database (Neon branch)
        run: node scripts/neon-snapshot.mjs
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          NEON_PRODUCTION_BRANCH_ID: ${{ vars.NEON_PRODUCTION_BRANCH_ID }}
          NEON_SNAPSHOT_REQUIRED: ${{ vars.NEON_SNAPSHOT_REQUIRED }}

      - name: Apply production database migrations
        run: vercel env run --token="$VERCEL_TOKEN" -e production -- npm run db:migrate:deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Build project
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Deploy to production
        id: deploy
        run: |
          DEPLOY_URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$DEPLOY_URL" >> $GITHUB_OUTPUT

      - name: Print deploy URL
        run: echo "Deployed to ${{ steps.deploy.outputs.url }}"
