name: Security audit

on:
  schedule:
    # Every Monday at 08:00 UTC (1 PM PKT)
    - cron: '0 8 * * 1'
  push:
    paths:
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  audit:
    name: npm audit (production dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      - name: Audit production dependencies (blocking)
        run: npm audit --omit=dev --audit-level=high

      - name: Audit all dependencies (informational)
        # Development-only findings are tracked in SYSTEM.md (R-06) and must
        # not turn this workflow red.
        run: npm audit --audit-level=high
        continue-on-error: true
